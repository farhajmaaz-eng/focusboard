<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c10" />
    <title>Not found — Focusboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet" />
    <style>
      :root { --ink-0: #07080b; --text: #e7eaf3; --text-2: #a8aebd; --accent: #7aa2ff; --accent-2: #b78bff; --grad: linear-gradient(135deg, #7aa2ff 0%, #a78be7 50%, #ed826d 100%); }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        background: var(--ink-0); color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
        display: grid; place-items: center;
        overflow: hidden;
        position: relative;
      }
      body::before {
        content: ""; position: absolute; inset: -20%;
        background:
          radial-gradient(circle at 20% 30%, rgba(122,162,255,.25), transparent 40%),
          radial-gradient(circle at 80% 70%, rgba(183,139,255,.22), transparent 40%);
        filter: blur(80px);
        animation: drift 16s ease-in-out infinite;
      }
      @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(20px,-20px); } }
      main { text-align: center; position: relative; padding: 40px; max-width: 520px; }
      h1 {
        font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(64px, 12vw, 120px);
        margin: 0 0 8px; letter-spacing: -0.03em;
        background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      p { color: var(--text-2); font-size: 15px; line-height: 1.6; margin: 0 0 28px; }
      a {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 11px 20px; border-radius: 12px;
        background: var(--grad); color: #0b0d12; font-weight: 600; font-size: 13px;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(122,162,255,.4);
        transition: transform .35s cubic-bezier(.34,1.56,.64,1);
      }
      a:hover { transform: translateY(-2px); }
      em { display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-2); letter-spacing: .16em; text-transform: uppercase; margin-bottom: 18px; font-style: normal; }
    </style>
  </head>
  <body>
    <main>
      <em>Error 404</em>
      <h1>Lost the thread.</h1>
      <p>The page you were looking for wandered off. Let's get you back to your day.</p>
      <a href="./">← Back to Focusboard</a>
    </main>
  </body>
</html>
